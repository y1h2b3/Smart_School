# 应用服务 WEB 访问端口
server:
  port: 8081

spring:
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher #2.6版本Spring MVC 处理映射匹配的默认策略已从AntPathMatcher更改为PathPatternParser

  # 环境
  profiles:
    active: dev
  main:
    # 允许对象循环调用
    allow-circular-references: true
  application:
    # 项目名称
    name: SmartSchool
  thymeleaf:
    # 检查模板是否存在，然后再呈现
    checkTemplate: true
    # 模板编码
    encoding: UTF-8
    # 在构建 URL 时添加到视图名称前的前缀
    prefix: classpath:/static/
  # 配置数据库信息
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_campus?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
  #redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      jedis:
        pool:
          max-active: 200
          max-idle: 10
          min-idle: 0
          max-wait: -1ms
  #ai - Spring AI Alibaba 官方配置
  ai:
    dashscope:
      api-key: sk-a8eb06b45ae64eef9299056d854a092a
      chat:
        options:
          model: qwen-plus
          temperature: 0.7





mybatis-plus:
  # 指定mybatis-plus的实体目录
  typeAliasesPackage: com.smart.www.pojo
  # 指定mybatis-plus的mapper文件
  mapperLocations: classpath:com/smark/www/mapper/*.xml
  configuration:
    # 开启驼峰命名
    mapUnderscoreToCamelCase: true

    # 是否开启二级缓存
    cacheEnabled: false
  globalConfig:
    dbConfig:
      # id为雪花算法生成
      idType: assign_id


# Knife4j 配置信息 - API 文档增强工具
# 访问地址: http://localhost:8081/doc.html
knife4j:
  # 开启 Knife4j 增强功能
  enable: true
  # 开启生产环境屏蔽（生产环境建议设为 true）
  production: false
  # 开启登录认证（可选）
  basic:
    enable: false

# SpringDoc 配置 - 基于 OpenAPI 3
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.smart.www.controller


# Logger Config
logging:
  level:
    com.hexadecimal: debug

sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# 书杰支付配置
shujiepay:
  # 商户ID（需要到书杰支付后台获取）
  pid: 1358
  # 平台公钥（用于验签，在后台 API信息 页面获取）
  platform-public-key: 
  # 商户私钥（用于签名，生成RSA密钥对时保存）
  merchant-private-key: 
  # 异步通知地址（需要公网地址，可使用内网穿透工具）
  notify-url: http://v2443f69.natappfree.ccv
  # 同步返回地址
  return-url: http://localhost:8081/pay/shujiepay/return






