# ============================================
# Smart Campus 配置文件
# ============================================
# 所有配置统一在此文件中管理
# 敏感信息通过环境变量配置（参考 .env.example）
# ============================================

# ==================== 服务器配置 ====================
server:
  port: ${SERVER_PORT:8718}

# ==================== Spring 配置 ====================
spring:
  profiles:
    active: prod
  
  mvc:
    pathmatch:
      # 2.6版本Spring MVC 处理映射匹配的默认策略已从AntPathMatcher更改为PathPatternParser
      matching-strategy: ant-path-matcher
  
  main:
    # 允许对象循环调用
    allow-circular-references: true
  
  application:
    # 项目名称
    name: SmartSchool
  
  thymeleaf:
    # 检查模板是否存在，然后再呈现
    check-template: true
    # 模板编码
    encoding: UTF-8
    # 在构建 URL 时添加到视图名称前的前缀
    prefix: classpath:/static/
  
  # ==================== 数据源配置 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_campus?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 初始化连接数
      initial-size: 5
      # 最小空闲连接数
      min-idle: 5
      # 最大活跃连接数
      max-active: 20
      # 获取连接等待超时时间
      max-wait: 60000
      # 配置间隔多久进行一次检测，检测需要关闭的空闲连接
      time-between-eviction-runs-millis: 60000
      # 配置连接在池中最小生存时间
      min-evictable-idle-time-millis: 300000
      # 验证连接有效性的SQL
      validation-query: SELECT 1
      # 空闲时检测连接是否有效
      test-while-idle: true
      # 获取连接时检测是否有效
      test-on-borrow: false
      # 归还连接时检测是否有效
      test-on-return: false
      # 开启PSCache
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 配置监控统计拦截的filters
      filters: stat,wall,slf4j
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
      # 配置DruidStatFilter
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      # 配置DruidStatViewServlet（访问 http://localhost:8718/druid）
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin
  
  # ==================== Redis 配置 ====================
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 200
          max-idle: 10
          min-idle: 0
          max-wait: -1ms
  
  # ==================== AI 配置 ====================
  ai:
    # OpenAI 配置
    openai:
      api-key: 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
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7



    # 阿里云通义千问配置
    dashscope:
      api-key: sk-50795f7ffba54a8490b31b5b4f0e0829
      chat:
        options:
          # 使用 qwen-turbo 更快（qwen-plus 和 qwen-max 更慢但更准确）
          model: qwen-plus
          temperature: 0.7
          # 启用流式输出获得更快的首字响应（可选）
          # stream: true
      # 优化超时时间（毫秒）- 更快失败检测
      connection-timeout: 30000  # 30秒
      read-timeout: 60000  # 60秒
    
    # 重试策略配置（减少测试等待时间）
    retry:
      max-attempts: 2  # 最多重试 2 次（默认 10 次）
      on-client-errors: false  # 不重试客户端错误 (4xx)
      backoff:
        initial-interval: 500ms  # 初始等待 0.5秒
        multiplier: 2.0  # 指数增长倍数（必须 > 1）
        max-interval: 2000ms  # 最大等待 2秒

    # MCP 客户端配置（必须在 spring.ai 下，不是 dashscope 下）
    mcp:
      client:
        # 增加请求超时时间
        request-timeout: 120s
        stdio:
          connections:
            amap-maps:
              # 使用 cmd.exe 执行，设置 UTF-8 编码（chcp 65001）
              command: cmd.exe
              args:
                - /c
                - chcp 65001 >nul && npx -y @amap/amap-maps-mcp-server
              env:
                AMAP_MAPS_API_KEY: 97d46cfa6c03fc5506ca5990c932ae2b
                PYTHONIOENCODING: utf-8
                LANG: en_US.UTF-8






# ==================== MyBatis Plus 配置 ====================
mybatis-plus:
  # 指定mybatis-plus的实体目录
  type-aliases-package: com.smart.www.pojo
  # 指定mybatis-plus的mapper文件
  mapper-locations: classpath:com/smart/www/mapper/*.xml
  configuration:
    # 开启驼峰命名
    map-underscore-to-camel-case: true
    # 是否开启二级缓存
    cache-enabled: false
  global-config:
    db-config:
      # id为雪花算法生成
      id-type: assign_id

# ==================== Knife4j 配置 - API 文档增强工具 ====================
# 访问地址: http://localhost:8718/doc.html
knife4j:
  # 开启 Knife4j 增强功能
  enable: true
  # 开启生产环境屏蔽（生产环境建议设为 true）
  production: false
  # 开启登录认证（可选）
  basic:
    enable: false

# ==================== SpringDoc 配置 - 基于 OpenAPI 3 ====================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.smart.www.controller

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.smart.www: DEBUG
    druid.sql.Statement: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# ==================== Sa-Token 配置 ====================
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

